name: Publish

on:
  push:
    branches: [ "master" ]
    paths:
      - "**/*.csproj"

jobs:
  check_version:    
    uses: Abaddax/workflows/.github/workflows/dotnet.check_version.yml@master
    with:
      CSPROJ_PATH: dotnet/Abaddax.Build.Common/Abaddax.Build.Common.csproj
       
  publish:  
    needs: [check_version]
    if: needs.check_version.outputs.version_changed == 'true'
    uses: ./.github/workflows/publish.nuget.yml
    permissions:
      contents: write
      id-token: write
    secrets:
      NUGET_USER: ${{ secrets.NUGET_USER }}
